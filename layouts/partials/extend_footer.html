<!-- Barba.js 动态无缝切换 -->
<script src="https://cdn.jsdelivr.net/npm/@barba/core@2.9.7/dist/barba.umd.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // 动态包裹主内容区，为 Barba 准备容器
    const main = document.querySelector('main.main');
    if (main) {
      // 如果已经包裹过则跳过
      if (!document.getElementById('barba-wrapper')) {
        const wrapper = document.createElement('div');
        wrapper.id = 'barba-wrapper';
        main.parentNode.insertBefore(wrapper, main);
        wrapper.appendChild(main);
        main.setAttribute('data-barba', 'container');
        main.setAttribute('data-barba-namespace', 'default');
      }
    }

    barba.init({
      transitions: [{
        name: 'fade',
        leave(data) {
          return new Promise(resolve => {
            data.current.container.style.opacity = 0;
            setTimeout(resolve, 100);
          });
        },
        enter(data) {
          data.next.container.style.opacity = 0;
          return new Promise(resolve => {
            setTimeout(() => {
              data.next.container.style.opacity = 1;
              resolve();
            }, 100);
          });
        }
      }],
      afterEnter(data) {
        // 重新绑定主题切换按钮
        const themeToggle = document.getElementById('theme-toggle');
        if (themeToggle) {
          themeToggle.onclick = function() {
            const html = document.documentElement;
            if (html.dataset.theme === 'dark') {
              html.dataset.theme = 'light';
              localStorage.setItem('pref-theme', 'light');
            } else {
              html.dataset.theme = 'dark';
              localStorage.setItem('pref-theme', 'dark');
            }
          };
        }
        // 重新执行代码高亮（如果你启用了）
        if (typeof hljs !== 'undefined') {
          document.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
        }
        // 确保搜索框功能正常（Pagefind 自动初始化，无需额外操作）
      }
    });
  });
</script>

<style>
  .barba-container {
    transition: opacity 0.1s ease;
  }
</style>
