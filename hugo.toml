baseURL = "https://fry.l2.ink/"
locale = "zh-cn"
title = "StormCrew's Website"
description = "一个记录灵感的地方"
theme = "PaperMod"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  showReadingTime = true
  showShareButtons = true
  showToc = true
  ShowSearch = true
  customCSS = ["css/custom.css"]
  enableMusic = true
  comments = true

[params.giscus]
  repo = "Fry00001/myblog"
  repoID = "R_kgDOTG9DKw"
  category = "博客评论"
  categoryID = "DIC_kwDOTG9DK84DAj7x"
  mapping = "title"
  strict = "1"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "top"
  theme = "preferred_color_scheme"
  lang = "zh-CN"

[[params.socialIcons]]
    name = "github"
    url = "https://github.com/Fry00001"

[[params.socialIcons]]
    name = "bilibili"
    url = "https://space.bilibili.com/1429298202"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20

  [[menu.main]]
    identifier = "about"
    name = "关于本站"
    url = "/about/"
    weight = 50

  [[menu.main]]
    identifier = "videos"
    name = "B站视频"
    url = "/videos/"
    weight = 30

  [[menu.main]]
    identifier = "nav"
    name = "网址导航"
    url = "/nav/"
    weight = 40

[markup.goldmark.renderer]
  unsafe = true