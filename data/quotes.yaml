quotes:
  - text: "欲买桂花同载酒，只可惜故人，何日再见呢。"
    author: "钟离"
  - text: "此世群魔诸神并起，我虽无意逐鹿，却知苍生苦楚。"
    author: "钟离"
  - text: "浮生一刹，万般皆舍。"
    author: "胡桃"
  - text: "剑光如我，斩尽芜杂。"
    author: "刻晴"
  - text: "若你困于无风之地，我将为你奏响高天之歌。"
    author: "温迪"
  - text: "最初的鸟儿是不会飞翔的，飞翔是他们勇敢跃入峡谷的奖励。"
    author: "安柏"
  - text: "此身应许臣民一梦，即是千世万代不变不移的永恒。"
    author: "雷电将军"
  - text: "每个生灵的意志都值得尊重，就像海中的游鱼，也有自己的方向。"
    author: "纳西妲"
  - text: "风，不属于任何人，它想去哪里，就去哪里。"
    author: "流浪者"
  - text: "见证者为见证而来，铭记者因铭记而生。"
    author: "那维莱特"  
  - text: "力量似乎渐渐回来了。不多，但有用。"
    author: "钟离"
  - text: "一切力量皆有其代价，一千种权力伴随着一千种责任。"
    author: "钟离"
  - text: "契约无法界定友谊，无法丈量情谊，那到底用什么才能称量你我之间情感的重量呢？"
    author: "钟离"
  - text: "人间归离复归离，借一浮生逃浮生。"
    author: "钟离"
  - text: "存在本身，就是足够美好的事情了吧。"
    author: "甘雨"
  - text: "觉得自己是正确的，就要大声地说出来，坚决地去行动。"
    author: "刻晴"
  - text: "正是因为你爱的人在这里，世界才变得如此美丽。"
    author: "刻晴"
  - text: "在黎明到来之前，必须要有人稍微照亮黑暗。"
    author: "迪卢克"
  - text: "只要坚信自己的道路，就无所谓天气是晴是雨。"
    author: "迪卢克"
  - text: "烟花易逝，人情长存。"
    author: "宵宫"
  - text: "当你重新踏上旅途之后，一定要记得旅途本身的意义。"
    author: "温迪"
  - text: "终点并不意味着一切，在抵达终点之前，用你的眼睛多多观察这个世界吧。"
    author: "温迪"
  - text: "风带来故事的种子，时间使之发芽。"
    author: "温迪"
  - text: "风向是会转变的，终有一天会吹向更加光亮的地方。"
    author: "温迪"
  - text: "只要不失去你的崇高，整个世界都会向你敞开。"
    author: "七天神像"
  - text: "人的生命，似洪水奔流，不遇着岛屿和暗礁，难以激起美丽的浪花。"
    author: "阿贝多"
  - text: "用自己的双脚丈量土地，将未知变为知识。"
    author: "阿贝多"
  - text: "现实是此岸，理想是彼岸，中间隔着湍急的河流，行动则是架在河上的桥梁。"
    author: "阿贝多"
  - text: "浮世景色百千年依旧，人之在世却如白露与泡影。"
    author: "雷电将军"
  - text: "厌离浮世泡影，欣求净土常道。"
    author: "雷电将军"
  - text: "就连追求永恒的我，存在形式都在不断变化；那我怎么能要求稻妻，还有生活在稻妻的每个人，都保持不变呢。"
    author: "雷电影"
  - text: "世人皆说雷电将军无念无想，但拥有这份力量的我，却只想要一个答案。"
    author: "雷电影"
  - text: "万事皆有代价；既然寻求常人无法企及之事，那就必然付出世人无法想象的代价。"
    author: "神里绫人"
  - text: "大多数人会因为大风迷眼而止步不前，只有少部分人能够借势而为。"
    author: "神里绫人"
  - text: "总有地上的生灵，敢于面对雷霆的威光。"
    author: "枫原万叶"
  - text: "若知是梦何须醒，不比真如一相会。"
    author: "神里绫华"
  - text: "世上一定存在着只有你能做到的事。"
    author: "神里绫华"
  - text: "想要留住雪花，但在手心里，它只会融化得更快。"
    author: "九条裟罗"
  - text: "所谓的永恒，就是不再失去已拥有之物，但从别的角度说，也放弃了得到更多的可能。"
    author: "八重神子"
  - text: "很多时候，我们直到经受切肤之痛，才不得不直视自身的懒惰、愚昧、鲁莽或傲慢。但大可不必为此懊悔，我们无法观测未来的所有可能性，只能靠这样略显笨拙的方式获取知识。"
    author: "纳西妲"
  - text: "你不需要变成飞鸟或者游鱼，只要你努力地生活，你所珍视的一切都会是你幸福的源泉。"
    author: "纳西妲"
  - text: "正是因为无法更改、不可违逆、只能接受，命运才会被称之为命运。"
    author: "纳西妲"
  - text: "不是所有折翼坠落的鹰，都能腾空而起，但如果不冒这个险，那就永远碰不到天空。"
    author: "纳西妲"
  - text: "将久居在黑暗中的人带离光明的指引，本身是一件残酷的事情。"
    author: "纳西妲"
  - text: "真理有正确，便会有对应的错误，然而万象万物生而复杂。"
    author: "纳西妲"
  - text: "人与人的关系，绝不是轻易就能抚回原状的白纸。"
    author: "纳西妲"
  - text: "世间的奇遇之所以存在，就是为了给世人带来转机。"
    author: "芙卡洛斯"
  - text: "我的故事已然落幕，接下来，是你们的故事了。"
    author: "芙宁娜"