quotes:
  - text: "欲买桂花同载酒，只可惜故人，何日再见呢。"
    author: "钟离"
  - text: "此世群魔诸神并起，我虽无意逐鹿，却知苍生苦楚。"
    author: "钟离"
  - text: "浮生一刹，万般皆舍。"
    author: "胡桃"
  - text: "剑光如我，斩尽芜杂。"
    author: "刻晴"
  - text: "若你困于无风之地，我将为你奏响高天之歌。"
    author: "温迪"
  - text: "最初的鸟儿是不会飞翔的，飞翔是他们勇敢跃入峡谷的奖励。"
    author: "安柏"
  - text: "此身应许臣民一梦，即是千世万代不变不移的永恒。"
    author: "雷电将军"
  - text: "每个生灵的意志都值得尊重，就像海中的游鱼，也有自己的方向。"
    author: "纳西妲"
  - text: "风，不属于任何人，它想去哪里，就去哪里。"
    author: "流浪者"
  - text: "见证者为见证而来，铭记者因铭记而生。"
    author: "那维莱特"