<script>
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.first-entry, .post-entry').forEach(entry => {
      const link = entry.querySelector('a.entry-link');
      if (!link) return;
      const path = new URL(link.href).pathname;
      const viewEl = entry.querySelector('.view-count-number');
      if (!viewEl) return;
      fetch('https://fry.l2.ink/api/counter?path=' + encodeURIComponent(path))
        .then(res => res.json())
        .then(data => { viewEl.textContent = Number(data.views) || 0; })
        .catch(() => { viewEl.textContent = '0'; });
    });
  });
  </script>
