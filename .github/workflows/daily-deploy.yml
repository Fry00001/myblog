name: Daily Rebuild

on:
  schedule:
    - cron: '0 20 * * *'   # 每天 UTC 20:00（北京时间次日 04:00）
  workflow_dispatch: # 允许在 GitHub 页面上手动触发

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages Deploy Hook
        run: |
          curl -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}"